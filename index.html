<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Графік відключень світла</title>
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<style>
  :root {
    /* fallback palette outside Telegram; inside Telegram --tg-theme-* wins */
    --c-bg: #f2f2f7; --c-card: #ffffff; --c-text: #15171a; --c-hint: #6b7078;
    --c-accent: #2481cc; --c-line: rgba(0,0,0,.09);

    --bg: var(--tg-theme-secondary-bg-color, var(--c-bg));
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--c-card)));
    --text: var(--tg-theme-text-color, var(--c-text));
    --hint: var(--tg-theme-hint-color, var(--c-hint));
    --accent: var(--tg-theme-link-color, var(--c-accent));
    --btn: var(--tg-theme-button-color, var(--c-accent));
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --line: var(--c-line);

    --on: #2a9157; --off: #d3423a; --maybe: #e0992b; --unk: #9aa0a6;
    --on-2: #8fd0aa; --maybe-2: #f4d79b;
    --radius: 16px;
  }
  :root[data-scheme="dark"] {
    --on: #45c47b; --off: #f0706a; --maybe: #f2b650; --unk: #7d838b;
    --on-2: #2f6b4a; --maybe-2: #6b5320;
    --c-line: rgba(255,255,255,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tg]) { --c-bg: #0f1012; --c-card: #1b1c1f; --c-text: #f2f3f5; --c-hint: #8d939b; --c-accent: #5aa9f0; }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 12px 12px calc(20px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  button, select { font: inherit; color: inherit; }

  .card { background: var(--card); border-radius: var(--radius); padding: 14px; }
  .card h2 { margin: 0 0 2px; font-size: 16px; font-weight: 650; }
  .muted { color: var(--hint); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 8px; }

  /* header */
  .top { display: flex; flex-direction: column; gap: 10px; }
  .title { font-size: 20px; font-weight: 700; margin: 4px 4px 0; letter-spacing: -.01em; }

  /* hero */
  .hero { --state: var(--unk); position: relative; overflow: hidden;
    background: var(--card); background: color-mix(in srgb, var(--state) 13%, var(--card)); }
  .hero.on { --state: var(--on); } .hero.off { --state: var(--off); } .hero.maybe { --state: var(--maybe); }
  .hero-main { display: flex; align-items: center; gap: 14px; }
  .badge { width: 54px; height: 54px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--state); color: #fff; }
  .badge svg { width: 28px; height: 28px; }
  .hero-title { font-size: 24px; font-weight: 750; letter-spacing: -.02em; line-height: 1.15; }
  .hero-sub { font-size: 15px; margin-top: 2px; }
  .hero-sub b { font-variant-numeric: tabular-nums; }
  .hero-next { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14px; color: var(--hint); }
  .hero-next b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .warn { background: color-mix(in srgb, var(--maybe) 18%, var(--card)); font-size: 14px; }

  /* day tabs */
  .tabs { display: flex; gap: 6px; margin: 10px 0 12px; }
  .tabs button { flex: 1; border: 1px solid var(--line); background: transparent; border-radius: 12px;
    padding: 8px 10px; text-align: left; cursor: pointer; line-height: 1.25; }
  .tabs button span { display: block; font-size: 12px; color: var(--hint); }
  .tabs button b { font-size: 14px; font-weight: 600; }
  .tabs button[aria-pressed="true"] { border-color: var(--btn); box-shadow: inset 0 0 0 1px var(--btn); }
  .tabs button:disabled { opacity: .5; cursor: default; }

  /* timeline bar */
  .sum { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; margin-bottom: 10px; }
  .sum i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .sum b { font-variant-numeric: tabular-nums; }
  .tl { position: relative; padding-top: 8px; }
  .bar { display: grid; grid-template-columns: repeat(48, 1fr); gap: 1px; height: 34px; border-radius: 8px; overflow: hidden; }
  .bar div { background: var(--on); }
  .bar .off { background: var(--off); }
  .bar .maybe { background: repeating-linear-gradient(135deg, var(--maybe) 0 3px, var(--maybe-2) 3px 6px); }
  .bar .unk { background: var(--unk); opacity: .45; }
  .bar .past { opacity: .5; }
  .now { position: absolute; top: 0; bottom: 18px; width: 2px; margin-left: -1px; background: var(--text); border-radius: 2px; pointer-events: none; }
  .now::before { content: ""; position: absolute; top: 0; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--text); }
  .axis { position: relative; height: 16px; margin-top: 4px; font-size: 11px; color: var(--hint); font-variant-numeric: tabular-nums; }
  .axis span { position: absolute; transform: translateX(-50%); }
  .axis span:first-child { transform: none; } .axis span:last-child { transform: translateX(-100%); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 13px;
    background: color-mix(in srgb, var(--off) 12%, var(--card)); font-variant-numeric: tabular-nums; }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
  .chip.maybe { background: color-mix(in srgb, var(--maybe) 16%, var(--card)); } .chip.maybe::before { background: var(--maybe); }
  .chip.active { outline: 2px solid var(--off); font-weight: 600; }
  .chip.done { opacity: .55; }
  .chip small { color: var(--hint); font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; font-size: 12px; color: var(--hint); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  .foot { font-size: 12px; color: var(--hint); padding: 2px 6px; display: flex; flex-direction: column; gap: 6px; }
  .foot a, .link { color: var(--accent); text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
  .btn { border: 0; background: var(--btn); color: var(--btn-text); padding: 10px 16px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  .skeleton { height: 120px; border-radius: var(--radius); background: var(--card); opacity: .6; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  // ---------- config ----------
  const REGIONS = [
    { id: 'odesa', name: 'Одещина', full: 'Одеська обл. · ДТЕК ОЕМ', site: 'https://www.dtek-oem.com.ua/ua/shutdowns' },
  ];
  const FIXED_GROUP = 'GPV2.2';   // Черга 2.2
  // Mirror of DTEK schedules (MIT, updated about every 5 min). Served with CORS *.
  const DATA_URL = id => `https://raw.githubusercontent.com/Baskerville42/outage-data-ua/main/data/${id}.json`;
  const REPO_URL = 'https://github.com/fastiuk/ukraine-energy-monitor';
  const MIRROR_URL = 'https://github.com/Baskerville42/outage-data-ua';
  const TZ = 'Europe/Kyiv';
  const REFRESH_MS = 5 * 60 * 1000;

  const tg = (window.Telegram && window.Telegram.WebApp) || null;
  const inTelegram = !!(tg && (tg.initData || (tg.themeParams && tg.themeParams.bg_color)));

  // ---------- tiny DOM helpers (data is never put into innerHTML) ----------
  const NS = 'http://www.w3.org/2000/svg';
  const h = (tag, props, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'style') e.setAttribute('style', v);
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) { if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
    return e;
  };
  const s = (tag, props, ...kids) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
    }
    for (const kid of kids.flat()) { if (kid == null) continue; e.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
    return e;
  };

  // ---------- storage (Telegram CloudStorage with localStorage fallback) ----------
  const ls = {
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const cloudOk = () => { try { return !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')); } catch (e) { return false; } };
  const store = {
    get(k) {
      return new Promise(res => {
        let done = false; const fin = v => { if (!done) { done = true; res(v); } };
        setTimeout(() => fin(ls.get('ob_' + k)), 700);
        if (!cloudOk()) return fin(ls.get('ob_' + k));
        try { tg.CloudStorage.getItem(k, (err, v) => fin(!err && v ? v : ls.get('ob_' + k))); } catch (e) { fin(ls.get('ob_' + k)); }
      });
    },
    set(k, v) {
      ls.set('ob_' + k, v);
      if (!cloudOk()) return;
      try { tg.CloudStorage.setItem(k, v, () => {}); } catch (e) {}
    },
  };
  const haptic = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} };
  const openLink = url => { try { if (tg && tg.openLink) return tg.openLink(url); } catch (e) {} window.open(url, '_blank', 'noopener'); };

  // ---------- time ----------
  const pad = n => String(n).padStart(2, '0');
  const hm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  const dayFmt = new Intl.DateTimeFormat('uk-UA', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short' });
  const clockFmt = new Intl.DateTimeFormat('uk-UA', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const dur = mins => {
    const hh = Math.floor(mins / 60), mm = mins % 60;
    return hh && mm ? `${hh} год ${mm} хв` : hh ? `${hh} год` : `${mm} хв`;
  };
  // m = minutes from today's midnight (may be >= 1440 for tomorrow)
  const fmtM = m => (m >= 1440 ? 'завтра ' + hm(m - 1440) : hm(m));
  const rangeText = (from, to) => {
    if (from >= 1440) return `завтра ${hm(from - 1440)}–${to === 2880 ? '24:00' : hm(to - 1440)}`;
    if (to === 1440) return `${hm(from)}–24:00`;
    if (to > 1440) return `${hm(from)} – завтра ${hm(to - 1440)}`;
    return `${hm(from)}–${hm(to)}`;
  };

  // ---------- data model ----------
  // DTEK format: hour "1".."24" → yes | no | first | second | maybe | mfirst | msecond
  const HALF = {
    yes: ['on', 'on'], no: ['off', 'off'], first: ['off', 'on'], second: ['on', 'off'],
    maybe: ['maybe', 'maybe'], mfirst: ['maybe', 'on'], msecond: ['on', 'maybe'],
  };
  const toSlots = hours => {
    const out = [];
    for (let i = 1; i <= 24; i++) out.push(...(HALF[hours[i]] || ['unk', 'unk']));
    return out;
  };
  const groupSortKey = k => { const m = /^GPV(\d+)\.(\d+)$/.exec(k); return m ? +m[1] * 10 + +m[2] : 1e9; };
  const slim = raw => ({
    fact: raw.fact || { data: {} },
    preset: { sch_names: (raw.preset && raw.preset.sch_names) || {}, data: (raw.preset && raw.preset.data) || {} },
    lastUpdated: raw.lastUpdated || null,
    ok: !(raw.lastUpdateStatus && raw.lastUpdateStatus.ok === false),
  });
  const MAX_BYTES = 3_000_000;

  async function fetchRegion(id) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 15000);
    try {
      const url = DATA_URL(id) + '?t=' + Math.floor(Date.now() / 300000);
      const r = await fetch(url, { signal: ctl.signal, cache: 'no-cache' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const txt = await r.text();
      if (txt.length > MAX_BYTES) throw new Error('response too large');
      const m = slim(JSON.parse(txt));
      if (!m.fact || typeof m.fact.data !== 'object' || Array.isArray(m.fact.data)) m.fact = { data: {}, update: m.fact && m.fact.update };
      ls.set('ob_cache_' + id, JSON.stringify({ at: Date.now(), m }));
      return { m, fetchedAt: Date.now(), cached: false };
    } finally { clearTimeout(timer); }
  }
  function cachedRegion(id) {
    try { const c = JSON.parse(ls.get('ob_cache_' + id)); if (c && c.m) return { m: c.m, fetchedAt: c.at, cached: true }; } catch (e) {}
    return null;
  }

  // ---------- state ----------
  const state = { region: 'odesa', group: FIXED_GROUP, day: 0, loaded: null, loading: true, error: null };
  const mem = {};   // region id → {m, fetchedAt, cached}

  const groupsOf = m => {
    const set = new Set();
    for (const d of Object.values(m.fact.data || {})) for (const g of Object.keys(d || {})) set.add(g);
    return [...set].sort((a, b) => groupSortKey(a) - groupSortKey(b));
  };
  const labelOf = (m, g) => (m.preset.sch_names && m.preset.sch_names[g]) || g.replace(/^GPV/, 'Черга ');
  const shortOf = (m, g) => labelOf(m, g).replace(/^Черга\s*/, '').replace(/^ЦЕК\s*/, 'Ц');

  function view() {
    const m = state.loaded && state.loaded.m;
    if (!m) return null;
    const now = Date.now() / 1000;
    const keys = Object.keys(m.fact.data || {}).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
    let ti = -1; keys.forEach((k, i) => { if (k <= now) ti = i; });
    const fresh = ti >= 0 && now - keys[ti] < 86400 + 3600;
    const days = [];
    if (fresh) {
      days.push({ key: keys[ti] });
      const nk = keys[ti + 1];
      if (nk && nk - keys[ti] < 90000) days.push({ key: nk });
    }
    const groups = groupsOf(m);
    const slotsFor = (day, g) => {
      const hrs = m.fact.data[String(day.key)] && m.fact.data[String(day.key)][g];
      return hrs ? toSlots(hrs) : null;
    };
    return { m, now, days, groups, fresh, slotsFor };
  }

  const ranges = slots => {
    const out = []; let i = 0;
    while (i < slots.length) { let j = i; while (j < slots.length && slots[j] === slots[i]) j++; out.push({ st: slots[i], from: i * 30, to: j * 30 }); i = j; }
    return out;
  };
  const STATE_TXT = { on: 'Світло є', off: 'Світла немає', maybe: 'Можливе відключення', unk: 'Немає даних' };

  // ---------- render ----------
  const app = document.getElementById('app');

  function render() {
    const v = view();
    const nodes = [renderTop()];
    if (state.loading && !v) nodes.push(h('div', { class: 'skeleton' }), h('div', { class: 'skeleton', style: 'height:200px' }));
    else if (state.error && !v) nodes.push(renderError());
    else if (v) nodes.push(...renderBody(v));
    nodes.push(renderFoot(v));
    app.replaceChildren(...nodes);
  }

  function renderTop() {
    return h('div', { class: 'top' },
      h('div', { class: 'title' }, '💡 Графік відключень'),
      h('div', { class: 'muted', style: 'margin:-6px 4px 0;font-size:15px' }, 'Одещина · Черга 2.2'));
  }

  function renderError() {
    return h('div', { class: 'card' },
      h('h2', {}, 'Не вдалося завантажити графік'),
      h('div', { class: 'muted' }, 'Перевірте з’єднання та спробуйте ще раз.'),
      h('button', { class: 'btn', onclick: () => load(true) }, 'Повторити'));
  }

  function renderBody(v) {
    const out = [];
    const g = state.group;
    const label = labelOf(v.m, g);
    const regionFull = REGIONS.find(r => r.id === state.region).full;

    if (state.loaded.cached || !v.m.ok) {
      out.push(h('div', { class: 'card warn' }, state.loaded.cached
        ? 'Немає зв’язку з джерелом — показано збережені дані. Вони можуть бути застарілими.'
        : 'Джерело тимчасово не оновлюється — показано останні відомі дані.'));
    }
    if (!v.fresh) {
      out.push(h('div', { class: 'card' }, h('h2', {}, 'Немає актуального графіка'),
        h('div', { class: 'muted' }, 'Оператор ще не опублікував графік на сьогодні' + (v.m.fact.update ? ` (останнє оновлення джерела: ${v.m.fact.update}).` : '.'))));
      return out;
    }
    const today = v.days[0], tomorrow = v.days[1] || null;
    const ts = v.slotsFor(today, g);
    if (!ts) {
      out.push(h('div', { class: 'card' }, h('h2', {}, 'Для черги ' + label + ' даних немає'), h('div', { class: 'muted' }, 'Оберіть іншу чергу.')));
      return out;
    }
    const tm = tomorrow ? v.slotsFor(tomorrow, g) : null;

    out.push(renderHero(v, today, ts, tm));

    const dayIdx = state.day === 1 && tm ? 1 : 0;
    const day = v.days[dayIdx];
    out.push(renderTimeline(v, day, dayIdx, dayIdx ? tm : ts, !!tm, tomorrow !== null));
    return out;
  }

  function renderHero(v, today, ts, tm) {
    const all = tm ? ts.concat(tm) : ts;
    const idx = Math.max(0, Math.min(47, Math.floor((v.now - today.key) / 1800)));
    const rs = ranges(all);
    const ci = rs.findIndex(r => idx * 30 >= r.from && idx * 30 < r.to);
    const cur = rs[ci];
    const kind = cur.st;
    const next = rs[ci + 1];
    const remaining = next ? Math.max(1, Math.ceil((today.key + next.from * 60 - v.now) / 60)) : null;

    let sub;
    if (kind === 'unk') sub = 'Оператор не вказав стан для цього часу';
    else if (next) {
      const verb = kind === 'on' ? 'до' : kind === 'off' ? 'Світло з’явиться о' : 'до';
      sub = h('span', {}, `${verb} `, h('b', {}, fmtM(next.from)), ` · через ${dur(remaining)}`);
    } else sub = tm ? 'до кінця завтрашньої доби' : 'до кінця доби';

    let nextLine = null;
    const upcoming = rs.slice(ci + 1).filter(r => r.st === 'off' || r.st === 'maybe');
    if (kind === 'on' || kind === 'maybe') {
      const n = upcoming.find(r => r.st === 'off') || upcoming[0];
      if (n && !(kind === 'maybe' && n === cur)) nextLine = h('span', {}, 'Наступне відключення: ', h('b', {}, rangeText(n.from, n.to)));
      else if (!n) nextLine = h('span', {}, tm ? 'Більше відключень за графіком немає' : 'Сьогодні відключень більше немає · графік на завтра ще не опублікований');
    } else if (kind === 'off') {
      const n = upcoming.find(r => r.st === 'off');
      nextLine = n ? h('span', {}, 'Потім відключення: ', h('b', {}, rangeText(n.from, n.to)))
        : h('span', {}, tm ? 'Далі відключень за графіком немає' : 'Графік на завтра ще не опублікований');
    }

    const bulb = s('svg', { viewBox: '0 0 24 24', fill: kind === 'on' ? 'currentColor' : 'none', stroke: 'currentColor', 'stroke-width': '1.8', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' },
      s('path', { d: 'M9 21h6M10 17.5h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2v.2h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z', 'fill-opacity': kind === 'on' ? '.28' : '0' }),
      kind === 'off' ? s('path', { d: 'M4 4l16 16' }) : null);
    return h('section', { class: `card hero ${kind}`, 'aria-label': 'Поточний стан' },
      h('div', { class: 'hero-main' }, h('div', { class: 'badge' }, bulb),
        h('div', {}, h('div', { class: 'hero-title' }, STATE_TXT[kind]), h('div', { class: 'hero-sub' }, sub))),
      nextLine ? h('div', { class: 'hero-next' }, nextLine) : null);
  }

  function renderTimeline(v, day, dayIdx, slots, hasTomorrow, tomorrowKnown) {
    const isToday = dayIdx === 0;
    const nowSlot = (v.now - v.days[0].key) / 1800;
    const cnt = st => slots.filter(x => x === st).length * 30;
    const off = cnt('off'), maybe = cnt('maybe'), on = cnt('on');
    const tab = (i, name, d, enabled) => h('button', { 'aria-pressed': dayIdx === i ? 'true' : 'false', disabled: !enabled, onclick: () => { state.day = i; haptic(); render(); } },
      h('b', {}, name), h('span', {}, d ? dayFmt.format(new Date(d.key * 1000 + 3600e3)) : 'очікується графік'));
    const tabs = h('div', { class: 'tabs' }, tab(0, 'Сьогодні', v.days[0], true), tab(1, 'Завтра', tomorrowKnown ? v.days[1] : null, hasTomorrow));

    const bar = h('div', { class: 'bar', role: 'img', 'aria-label': `Графік по півгодинах: без світла ${dur(off)}` },
      slots.map((st, i) => h('div', { class: st + (isToday && i + 1 <= Math.floor(nowSlot) ? ' past' : ''), title: `${hm(i * 30)}–${hm(i * 30 + 30)}: ${STATE_TXT[st]}` })));
    const axis = h('div', { class: 'axis' }, [0, 3, 6, 9, 12, 15, 18, 21, 24].map(hh => h('span', { style: `left:${hh / 24 * 100}%` }, pad(hh))));
    const tl = h('div', { class: 'tl' }, bar, axis,
      isToday ? h('div', { class: 'now', style: `left:${Math.max(0, Math.min(100, nowSlot / 48 * 100))}%` }) : null);

    const rs = ranges(slots).filter(r => r.st === 'off' || r.st === 'maybe');
    const nowMin = isToday ? nowSlot * 30 : -1;
    const chips = rs.length
      ? h('div', { class: 'chips' }, rs.map(r => h('span', { class: `chip ${r.st}${nowMin >= r.from && nowMin < r.to ? ' active' : ''}${nowMin >= r.to ? ' done' : ''}` },
          rangeText(r.from, r.to), ' ', h('small', {}, (r.st === 'maybe' ? 'можливо · ' : '') + dur(r.to - r.from)))))
      : h('div', { class: 'muted', style: 'margin-top:12px' }, 'Відключень за графіком немає 🎉');

    const sum = h('div', { class: 'sum' },
      h('span', {}, h('i', { style: 'background:var(--off)' }), 'Без світла ', h('b', {}, dur(off) || '0 хв')),
      maybe ? h('span', {}, h('i', { style: 'background:var(--maybe)' }), 'Можливо ', h('b', {}, dur(maybe))) : null,
      h('span', {}, h('i', { style: 'background:var(--on)' }), 'Зі світлом ', h('b', {}, dur(on) || '0 хв')));
    const legend = h('div', { class: 'legend' },
      h('span', {}, h('i', { style: 'background:var(--on)' }), 'є світло'),
      h('span', {}, h('i', { style: 'background:var(--off)' }), 'немає світла'),
      h('span', {}, h('i', { style: 'background:repeating-linear-gradient(135deg,var(--maybe) 0 3px,var(--maybe-2) 3px 6px)' }), 'можливе відключення'),
      isToday ? h('span', {}, h('i', { style: 'background:var(--text);width:3px;height:11px;border-radius:2px' }), 'зараз') : null);
    return h('section', { class: 'card' }, h('h2', {}, 'Графік · черга ' + shortOf(v.m, state.group)), tabs, sum, tl, chips, legend);
  }

  function renderFoot(v) {
    const checked = state.loaded ? clockFmt.format(new Date(state.loaded.fetchedAt)) : null;
    return h('div', { class: 'foot' },
      v && v.m.fact.update ? h('span', {}, `Дані оператора оновлено: ${v.m.fact.update}` + (checked ? ` · перевірено о ${checked}` : '')) : null,
      h('span', {}, '«Господь – світло моє і порятунок мій: кого мені боятися?» (Книга Псалмів 26:1)'));
  }

  // ---------- actions ----------
  async function load(force) {
    const id = state.region;
    if (!force && mem[id] && Date.now() - mem[id].fetchedAt < 120000) { state.loaded = mem[id]; state.loading = false; ensureGroup(); return render(); }
    state.error = null;
    if (!state.loaded || state.loaded.id !== id) { state.loading = true; state.loaded = null; const c = cachedRegion(id); if (c) { state.loaded = { ...c, id }; ensureGroup(); } render(); }
    try {
      const res = await fetchRegion(id);
      if (state.region !== id) return;
      mem[id] = state.loaded = { ...res, id };
    } catch (e) {
      if (state.region !== id) return;
      const c = state.loaded || cachedRegion(id);
      if (c) state.loaded = { ...c, id, cached: true }; else state.error = e;
    }
    state.loading = false;
    ensureGroup();
    render();
  }
  function ensureGroup() {}

  function applyScheme() {
    const sch = (tg && tg.colorScheme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.scheme = sch;
    if (inTelegram) document.documentElement.dataset.tg = '1';
    // Telegram's own script sets --tg-theme-* too; mirror them so the theme also follows themeChanged
    try {
      for (const [k, val] of Object.entries((tg && tg.themeParams) || {})) {
        if (/^[a-z_]+$/.test(k) && /^#[0-9a-f]{3,8}$/i.test(val)) document.documentElement.style.setProperty('--tg-theme-' + k.replace(/_/g, '-'), val);
      }
    } catch (e) {}
    try { if (tg && tg.setHeaderColor) tg.setHeaderColor('secondary_bg_color'); } catch (e) {}
    try { if (tg && tg.setBackgroundColor) tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
  }

  // ---------- boot ----------
  (async function init() {
    applyScheme();
    try { if (tg) { tg.ready(); tg.expand(); tg.onEvent('themeChanged', applyScheme); } } catch (e) {}
    matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyScheme);

    await load(true);
    // keep clock-based parts fresh and re-pull data periodically
    setInterval(() => { if (!document.hidden && state.loaded) render(); }, 30000);
    setInterval(() => { if (!document.hidden) load(true); }, REFRESH_MS);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      if (state.loaded && Date.now() - state.loaded.fetchedAt > 120000) load(true); else render();
    });
  })();
})();
</script>
</body>
</html>
